<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizsteries — prototyp</title>
  <!-- Noto Sans Medium — font widoku quizu (Caudex leży lokalnie w assets/fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Prototyp gry „Quizsteries”. Ekrany przełączane w pasku u góry:
    INSTRUKTAŻ (ekran wspólny) i TABLET GRACZA w dwóch trybach gry —
    WOULD YOU PRESS oraz QUIZ. Instruktaż i tablet w realnej rozgrywce
    lecą równocześnie na dwóch różnych ekranach.

    Scena ma stałe wymiary (px z Figmy) i jest skalowana do okna przez
    transform: scale(). Cała zawartość sceny generowana jest w app.js
    z obiektów konfiguracyjnych na górze pliku.

    Pasek na górze NIE jest częścią designu — to podgląd: wybór ekranu,
    wersja timera oraz symulacja żyć i końca gry.
  -->
  <header id="topbar">
    <span class="topbar-title">Quizsteries</span>
    <select id="view-select" aria-label="Ekran"></select>

    <!-- data-views mówi, na których ekranach grupa jest widoczna; panel żyć
         obsługuje dwa ekrany Would You Press, więc ma ich na liście dwa -->
    <div class="topbar-group" data-views="instruktaz">
      <div id="version-switch" class="switch" role="group" aria-label="Wersja timera"></div>
      <span>kolor</span>
      <div id="timer-color-switch" class="switch" role="group" aria-label="Kolor timera"></div>
    </div>

    <div class="topbar-group" data-views="tablet wynik">
      <span>życia</span>
      <div id="lives-switch" class="switch" role="group" aria-label="Liczba żyć"></div>
      <div class="switch">
        <button type="button" id="lose-life">−1 życie</button>
      </div>
      <span>animacja</span>
      <div id="anim-switch" class="switch" role="group" aria-label="Wariant animacji utraty życia"></div>
    </div>

    <div class="topbar-group" data-views="tablet">
      <span>feedback</span>
      <div id="wyp-feedback-switch" class="switch" role="group" aria-label="Wersja feedbacku po odpowiedzi"></div>
      <div id="wyp-outcome-switch" class="switch" role="group" aria-label="Dobra czy zła odpowiedź"></div>
    </div>

    <div class="topbar-group" data-views="quiz">
      <div id="quiz-switch" class="switch" role="group" aria-label="Wersja animacji wciśnięcia"></div>
    </div>

    <div class="topbar-group" data-views="wyniki">
      <div id="results-switch" class="switch" role="group" aria-label="Wersja animacji wyników"></div>
      <div class="switch">
        <button type="button" id="results-replay">▶ od nowa</button>
      </div>
    </div>

    <span class="topbar-hint" id="topbar-hint"></span>
  </header>

  <div id="viewport">
    <div id="scene"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
